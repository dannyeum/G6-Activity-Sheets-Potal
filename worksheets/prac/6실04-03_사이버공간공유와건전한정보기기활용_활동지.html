<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌐 안전하게 나눠요! 사이버 공간 공유와 건전한 정보기기 활용 | 6학년 실과 [6실04-03]</title>
<!--
=====================================================================
  초등 6학년 인터랙티브 활동지 (2022 개정 교육과정)
  6학년 실과 성취기준 [6실04-03] 발표 자료를 사이버 공간에 공유하는 방법을 알고, 건전한 정보기기 활용 태도를 가진다.

  ✏️ 선생님 수정 안내
  - 화면에 나오는 글, 개념 카드, 탐구 활동, 퀴즈는 <script> 맨 위의
    CONFIG 객체만 고치면 바뀝니다. (각 항목 옆 주석 참고)
  - 탐구 활동 종류(type): sort(분류), order(순서), match(짝짓기),
    fill(빈칸 채우기), map(지도에 이름 붙이기), calc(혼합 계산),
    listen(듣고 고르기), dynamics(셈여림·빠르기 슬라이더), write(생각 쓰기),
    numline(수직선에 수의 범위 나타내기), shadow(따라 읽기·녹음), audioquiz(소리 듣고 고르기), darkroom(빛의 양 조절해 물체 찾기), beaker(비커 녹이기 실험), compose(가락 만들기), arm(팔 모형)
  - 디자인 색상은 <style> 맨 위의 :root 변수에서 바꿀 수 있습니다.
  - 외부 라이브러리·인터넷 연결 없이 파일 하나로 작동합니다.
=====================================================================
-->
<style>
  /* ============ 1. 색상·글꼴 (여기서 전체 분위기를 바꿀 수 있어요) ============ */
  :root{
    --bg:#fff8f0; --card:#ffffff; --ink:#4a3f55; --muted:#8a7f96;
    --pink:#ffd6e0; --peach:#ffe5cc; --mint:#d4f5e9; --sky:#d6ecff; --lilac:#e8ddff; --lemon:#fff4c2;
    --accent:#ff8fab; --accent2:#7cc6fe; --good:#3bb27a; --bad:#ef6f6c;
    --radius:20px; --shadow:0 6px 18px rgba(120,90,140,.12);
    --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);
       background-image:radial-gradient(circle at 10% 10%,#ffeef3 0,transparent 30%),radial-gradient(circle at 90% 30%,#e9f6ff 0,transparent 30%);
       line-height:1.6;font-size:17px;-webkit-text-size-adjust:100%}
  .wrap{max-width:980px;margin:0 auto;padding:16px}
  h1,h2,h3{margin:0;line-height:1.3}
  button{font-family:inherit;font-size:1rem;cursor:pointer;border:none}
  input,textarea{font-family:inherit;font-size:1rem}

  /* ============ 2. 상단 헤더 ============ */
  header.top{background:linear-gradient(135deg,var(--pink),var(--lilac));border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  header.top .deco{position:absolute;right:-6px;bottom:-18px;font-size:90px;opacity:.25;pointer-events:none}
  .badge{display:inline-block;background:#fff;border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700;color:#b04a7a;margin:0 6px 6px 0}
  header.top h1{font-size:1.6rem;margin:6px 0}
  .std{background:rgba(255,255,255,.75);border-radius:14px;padding:10px 14px;font-size:.95rem;margin-top:8px}
  .std b{color:#b04a7a}
  .goal{margin-top:6px;font-size:.95rem}
  .student{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .student label{flex:1 1 180px;background:#fff;border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:700}
  .student input{flex:1;border:none;border-bottom:2px dashed #e3c6d6;padding:4px;background:transparent;min-width:0;outline:none}
  .student input:focus{border-bottom-color:var(--accent)}
  nav.steps{position:sticky;top:0;z-index:20;display:flex;gap:6px;padding:10px 0;background:var(--bg);overflow-x:auto}
  nav.steps a{flex:1 0 auto;text-decoration:none;color:var(--ink);background:#fff;border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:700;box-shadow:var(--shadow);text-align:center;white-space:nowrap}
  nav.steps a.done{background:var(--mint)}
  nav.steps a.done::after{content:" ✔"}

  /* ============ 3. 공통 카드 ============ */
  section.box{background:var(--card);border-radius:var(--radius);padding:20px;margin:16px 0;box-shadow:var(--shadow)}
  .sec-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sec-title .ico{font-size:1.8rem;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:0 0 auto}
  .sec-title h2{font-size:1.3rem}
  .sec-title small{display:block;color:var(--muted);font-weight:400;font-size:.85rem}
  .talk{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
  .talk .who{font-size:2.2rem;flex:0 0 auto;animation:bob 2.4s ease-in-out infinite}
  .bubble{position:relative;background:var(--lemon);border-radius:18px;padding:10px 14px;flex:1}
  .bubble::before{content:"";position:absolute;left:-8px;top:16px;border:8px solid transparent;border-right-color:var(--lemon);border-left:0}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .btn{background:var(--accent);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;box-shadow:0 4px 0 #e06c8c;transition:transform .1s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e06c8c}
  .btn.blue{background:var(--accent2);box-shadow:0 4px 0 #4fa3df}
  .btn.gray{background:#c9c0d3;box-shadow:0 4px 0 #a99fb4}
  .btn.small{padding:6px 12px;font-size:.9rem}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .feedback{margin-top:10px;padding:10px 14px;border-radius:14px;display:none}
  .feedback.show{display:block;animation:pop .35s}
  .feedback.good{background:#e3f7ec;color:#1f7a4f}
  .feedback.bad{background:#ffecec;color:#a33a37}
  .feedback.info{background:var(--sky);color:#2d5d86}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

  /* ============ 4. 개념 카드 ============ */
  .concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .ccard{border-radius:18px;padding:14px;opacity:0;transform:translateY(24px) scale(.96);transition:opacity .6s ease,transform .6s ease;cursor:pointer;display:flex;flex-direction:column}
  .ccard.show{opacity:1;transform:none}
  .ccard.read{box-shadow:0 0 0 4px #fff inset}
  .ccard .emo{font-size:2rem}
  .ccard h3{font-size:1.05rem;margin:4px 0}
  .ccard p{margin:0;font-size:.95rem}
  .ccard .ex{margin-top:auto;background:rgba(255,255,255,.75);border-radius:12px;padding:6px 10px;font-weight:800;text-align:center;font-size:1.05rem}
  .ccard .ex:empty{display:none}
  .ccard p + .ex{margin-top:10px}

  /* ============ 5. 드래그 앤 드롭 공통 ============ */
  .pool{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;padding:10px;border:3px dashed #e4d6ef;border-radius:16px;background:#fcfaff}
  .pool:empty::before{content:"모든 카드를 옮겼어요! ✨";color:#bcb2c7;font-size:.9rem;align-self:center}
  .drop-hover{background:var(--sky)!important}
  .dcard{background:var(--peach);border-radius:14px;padding:8px 12px;font-size:.95rem;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 #f2c9a3;max-width:100%;line-height:1.4}
  .dcard.ok{background:#c9f0dc;box-shadow:0 3px 0 #94d6b4}
  .dcard.no{background:#ffd3d1;box-shadow:0 3px 0 #f0a7a3}
  .selected{outline:4px solid var(--accent2);outline-offset:2px}
  .ghost{position:fixed;pointer-events:none;z-index:999;opacity:.9;transform:rotate(3deg) scale(1.05);box-shadow:0 10px 24px rgba(0,0,0,.2)}
  /* 칸(슬롯) */
  .slots{display:grid;gap:8px;margin-top:12px}
  .slot{display:flex;align-items:center;gap:10px;min-height:56px;border-radius:14px;background:#f6f1fb;padding:6px 10px;border:3px solid transparent}
  .slot .num{flex:0 0 auto;min-width:34px;height:34px;border-radius:17px;background:var(--lilac);display:grid;place-items:center;font-weight:800;padding:0 8px}
  .slot .left{flex:1 1 45%;font-size:.95rem}
  .slot .holder{flex:1 1 55%;min-height:40px;display:flex;align-items:center}
  .slot .holder:empty::before{content:"여기에 카드를 놓아요";color:#bcb2c7;font-size:.9rem}
  .slot.ok{border-color:var(--good);background:#e9f9f1}
  .slot.no{border-color:var(--bad);background:#fff0f0}
  .match .slot{flex-wrap:wrap}
  /* 분류 바구니 */
  .bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
  .bin{border-radius:16px;padding:10px;min-height:150px;border:3px solid transparent}
  .bin h4{margin:0 0 8px;text-align:center;font-size:1.05rem}
  .bin .holder{display:flex;flex-direction:column;gap:6px;min-height:80px}
  /* 빈칸 채우기 */
  .fill-text{font-size:1.08rem;line-height:2.6;background:#fbf8ff;border-radius:16px;padding:12px 16px;margin-top:12px}
  .blank{display:inline-flex;vertical-align:middle;min-width:110px;min-height:40px;border-bottom:3px solid var(--accent2);background:#eef7ff;border-radius:10px;margin:0 4px;padding:2px;align-items:center;justify-content:center}
  .blank .holder{display:inline-flex}
  .blank.ok{background:#e3f7ec;border-color:var(--good)}
  .blank.no{background:#ffecec;border-color:var(--bad)}
  /* 지도 */
  .mapwrap{position:relative;max-width:420px;margin:12px auto 0;background:linear-gradient(#e6f4ff,#d3ecff);border-radius:18px;overflow:hidden}
  .mapwrap svg{display:block;width:100%;height:auto}
  .spot{position:absolute;transform:translate(-50%,-50%);min-width:72px;min-height:34px;border-radius:12px;background:rgba(255,255,255,.85);border:2px dashed #9b8bb0;display:flex;align-items:center;justify-content:center;padding:2px;font-size:.8rem}
  .spot .holder:empty::before{content:attr(data-n);color:#9b8bb0;font-weight:800}
  .spot .dcard{font-size:.8rem;padding:4px 8px}
  .spot.ok{border:3px solid var(--good);background:#e9f9f1}
  .spot.no{border:3px solid var(--bad);background:#fff0f0}
  /* 혼합 계산 */
  .expr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:1.9rem;font-weight:800;background:#fbf8ff;border-radius:18px;padding:16px;min-height:90px}
  .expr .num{padding:0 4px}
  .expr .par{color:#b04a7a}
  .expr .op{background:var(--lemon);border-radius:12px;min-width:48px;height:48px;font-size:1.6rem;font-weight:900;color:var(--ink);box-shadow:0 3px 0 #e8d98a}
  .expr .op:hover{background:#ffe98a}
  .expr .new{animation:pop .5s;color:#2d8a5f}
  .calc-log{margin-top:10px;font-size:1rem}
  .calc-log li{margin:2px 0}
  /* 듣고 고르기 */
  .litem{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-radius:14px;background:#fbf8ff;margin:8px 0;border:2px solid #efe6f7}
  .litem .say{font-weight:800;font-size:1.1rem;min-width:140px}
  .litem .choice{background:#fff;border:2px solid #e8dcf2;border-radius:12px;padding:6px 14px;font-size:1.05rem;color:var(--ink)}
  .litem .choice.correct{border-color:var(--good);background:#e3f7ec}
  .litem .choice.incorrect{border-color:var(--bad);background:#ffecec}
  .litem.done{border-color:var(--good)}
  .speak{background:var(--accent2);color:#fff;border-radius:50%;width:44px;height:44px;font-size:1.2rem;flex:0 0 auto}
  .litem .msg{flex-basis:100%;font-size:.92rem}
  /* 셈여림 */
  .dyn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
  .dyn-sym{font-size:4rem;font-weight:900;font-style:italic;font-family:Georgia,serif;text-align:center;line-height:1;transition:transform .2s}
  .dyn-name{text-align:center;font-weight:700}
  .dyn-bars{display:flex;align-items:flex-end;gap:6px;height:80px;justify-content:center;margin:8px 0}
  .dyn-bars i{width:22px;border-radius:6px 6px 0 0;background:var(--accent2);transition:height .2s,opacity .2s}
  .mission{background:var(--lemon);border-radius:16px;padding:12px;text-align:center}
  .mission .target{font-size:2.4rem;font-weight:900;font-style:italic;font-family:Georgia,serif}
  input[type=range]{width:100%;accent-color:#4fa3df;height:30px}
  /* 생각 쓰기 */
  .wfield{margin:10px 0}
  .wfield label{display:block;font-weight:700;margin-bottom:4px}
  .wfield input[type=text],textarea{width:100%;border:2px solid #eadff3;border-radius:14px;padding:10px;background:#fff}
  textarea{min-height:80px;resize:vertical}
  .wfield input[type=color]{width:80px;height:44px;border:none;background:none;padding:0}

  .dr-room{position:relative;height:260px;border-radius:18px;background:linear-gradient(#fff7e0,#ffe9c7);overflow:hidden;border:4px solid #4a3f55}
  .dr-shade{position:absolute;inset:0;background:#0b0820;pointer-events:none;z-index:2;transition:opacity .2s}
  .dr-obj{position:absolute;transform:translate(-50%,-50%);font-size:2.6rem;background:none;z-index:3;transition:filter .2s}
  .dr-obj.found{outline:4px solid var(--good);border-radius:12px}
  .bk-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
  .bk-beaker{position:relative;width:170px;height:200px;margin:12px auto 0;border:4px solid #9bb7cf;border-top:none;border-radius:0 0 26px 26px;overflow:hidden;background:#fff}
  .bk-water{position:absolute;left:0;right:0;bottom:0;height:78%}
  .bk-pile{position:absolute;left:18%;right:18%;bottom:0;border-radius:50% 50% 0 0;transition:height .3s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
  .bk-label{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:.85rem;font-weight:700}
  .bk-scale{text-align:center;margin-top:6px;background:#fbf8ff;border-radius:12px;padding:6px}
  .bk-tbl{width:100%;border-collapse:collapse;background:#fff}
  .bk-tbl th,.bk-tbl td{border:2px solid #eadff3;padding:6px;text-align:center}
  .bk-tbl th{background:var(--lilac)}
  .cp-grid{display:grid;gap:3px;background:#fbf8ff;padding:8px;border-radius:14px}
  .cp-lab{font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
  .cp-cell{height:30px;border-radius:7px;background:#fff;border:2px solid #eadff3}
  .cp-cell:hover{background:#f4faff}
  .cp-cell.locked{background:#f3eef7;cursor:not-allowed}
  .cp-cell.on.locked{background:#c9a7d8;border-color:#a77fbf}
  .cp-cell.on{background:var(--accent);border-color:#e06c8c}
  .arm-svg{width:100%;max-width:460px;display:block;margin:0 auto;background:#fffaf2;border-radius:16px}
  .demo-box{background:var(--lemon);border-radius:14px;padding:10px 12px;margin-bottom:8px}
  /* 수직선 */
  .nl{width:100%;height:auto;display:block;margin:10px 0}
  .nl-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .nl-end{background:#fbf8ff;border-radius:14px;padding:10px}
  .nl-none{display:block;font-size:.9rem;margin:4px 0}
  .nl-v{font-size:1.4rem;font-weight:900;min-width:36px;text-align:center}
  /* 따라 읽기 */
  .sitem{padding:12px;border-radius:14px;background:#fbf8ff;margin:8px 0;border:2px solid #efe6f7}
  .sitem.done{border-color:var(--good)}
  .stext{font-size:1.3rem;margin-bottom:8px}
  .stext .stress{color:#e0457a;font-size:1.15em;text-decoration:underline wavy #ffb3c7}
  .stext .arrow{font-size:1.4rem;color:#4fa3df;font-weight:900}
  .star{background:none;font-size:1.4rem;padding:0 2px}
  .rec-on{background:var(--bad)!important;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .sitem .msg{font-size:.9rem;margin-top:6px}
  /* ============ 6. 형성 평가 ============ */
  .q{border-radius:18px;padding:14px;margin:12px 0;background:#fbf8ff;border:2px solid #efe6f7}
  .q h3{font-size:1.02rem;margin-bottom:8px}
  .q h3 .qn{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:0 8px;margin-right:6px}
  .opts{display:grid;gap:8px}
  .opt{text-align:left;background:#fff;border:2px solid #e8dcf2;border-radius:14px;padding:10px 12px;color:var(--ink)}
  .opt:hover:not(:disabled){border-color:var(--accent2);background:#f4faff}
  .opt.correct{border-color:var(--good);background:#e3f7ec;font-weight:700}
  .opt.correct::after{content:" ⭕"}
  .opt.incorrect{border-color:var(--bad);background:#ffecec}
  .opt.incorrect::after{content:" ❌"}
  .opt:disabled{cursor:default}
  .score-panel{display:none;text-align:center;background:linear-gradient(135deg,var(--lemon),var(--mint));border-radius:20px;padding:20px}
  .score-panel.show{display:block;animation:pop .5s}
  .score-panel .big{font-size:2.2rem;font-weight:900}
  .stars{font-size:2rem;letter-spacing:4px}

  /* ============ 7. 결과 ============ */
  .summary{background:#fbf8ff;border-radius:16px;padding:14px}
  .summary li{margin:4px 0}
  .folder-box{margin-top:12px;background:var(--lemon);border-radius:16px;padding:10px 14px;display:none}
  .folder-box.show{display:block}
  .folder-label{font-size:.9rem;font-weight:700;word-break:break-all}
  .folder-label.on{color:#1f7a4f}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#4a3f55;color:#fff;padding:10px 18px;border-radius:999px;transition:transform .3s;z-index:1000;max-width:90%;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 0 30px}
  .confetti{position:fixed;top:-20px;font-size:22px;z-index:998;pointer-events:none;animation:drop 2.4s linear forwards}
  @keyframes drop{to{transform:translateY(110vh) rotate(540deg)}}

  /* ============ 8. 반응형 ============ */
  @media (max-width:720px){
    body{font-size:16px}
    header.top h1{font-size:1.3rem}
    .dyn{grid-template-columns:1fr}
    .nl-ctrl{grid-template-columns:1fr}
    .bk-wrap{grid-template-columns:1fr}
    .slot .left,.slot .holder{flex-basis:100%}
    .expr{font-size:1.5rem}
    .expr .op{min-width:42px;height:42px}
    .spot{min-width:58px;font-size:.7rem}
    .spot .dcard{font-size:.7rem;padding:3px 5px}
  }
  /* ============ 9. 인쇄/PDF ============ */
  @media print{
    body{background:#fff;font-size:12pt}
    nav.steps,.btn,.toast,.no-print,.confetti,.speak{display:none!important}
    section.box,header.top{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
    .ccard{opacity:1!important;transform:none!important}
    .print-only{display:block!important}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  .print-only{display:none}
</style>
</head>
<body>
<div class="wrap">
  <!-- ===================== 상단 헤더 ===================== -->
  <header class="top">
    <div class="deco" id="deco"></div>
    <span class="badge" id="subjectBadge"></span><span class="badge" id="unitBadge"></span>
    <h1 id="title"></h1>
    <div class="std"><b id="stdCode"></b> <span id="stdText"></span>
      <div class="goal">🎯 <b>오늘의 목표</b> : <span id="goalText"></span></div></div>
    <div class="student">
      <label>🧒 이름 <input id="stuName" placeholder="이름을 써요" autocomplete="off"></label>
      <label>🔢 학번 <input id="stuId" placeholder="예: 6-2-15" autocomplete="off"></label>
    </div>
  </header>
  <nav class="steps no-print" id="nav"></nav>

  <!-- ===================== 개념 쏙쏙 (도입) ===================== -->
  <section class="box" id="s-concept">

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2400);}
function confetti(n=24){const it=["🎉","⭐","💖","✨","🌈",CONFIG.mascot];for(let i=0;i<n;i++){const c=document.createElement("div");c.className="confetti";c.textContent=it[i%it.length];c.style.left=Math.random()*100+"vw";c.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),3200);}}
function showFb(el,kind,html){el.className="feedback show "+kind;el.innerHTML=html;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleNotSame(a){if(a.length<2)return a.slice();let s;do{s=shuffle(a);}while(s.every((v,i)=>v===a[i]));return s;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}

/* =====================================================================
   드래그 앤 드롭 엔진 (마우스·터치 모두 지원)
   - 카드를 끌어서 놓거나, 카드를 한 번 누른 뒤 놓을 곳을 눌러도 돼요.
   ===================================================================== */
let drag=null,picked=null;
document.addEventListener("pointerdown",e=>{const c=e.target.closest("[data-drag]");if(!c||c.dataset.locked==="1")return;drag={el:c,x0:e.clientX,y0:e.clientY,ghost:null,dx:0,dy:0};});
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<8)return;
    const r=drag.el.getBoundingClientRect(),g=drag.el.cloneNode(true);
    g.classList.add("ghost");g.classList.remove("selected");g.style.width=r.width+"px";
    drag.dx=drag.x0-r.left;drag.dy=drag.y0-r.top;document.body.appendChild(g);drag.ghost=g;
  }
  e.preventDefault();
  drag.ghost.style.left=(e.clientX-drag.dx)+"px";drag.ghost.style.top=(e.clientY-drag.dy)+"px";
  document.querySelectorAll(".drop-hover").forEach(z=>z.classList.remove("drop-hover"));
  const z=zoneAt(e.clientX,e.clientY);if(z&&z.dataset.act===drag.el.dataset.act)z.classList.add("drop-hover");
},{passive:false});
document.addEventListener("pointerup",e=>{
  if(!drag)return;const d=drag;drag=null;
  document.querySelectorAll(".drop-hover").forEach(z=>z.classList.remove("drop-hover"));
  if(d.ghost){d.ghost.remove();const z=zoneAt(e.clientX,e.clientY);if(z)dropCard(d.el,z);clearPick();}
  else{if(picked===d.el){clearPick();return;}clearPick();picked=d.el;d.el.classList.add("selected");}
});
document.addEventListener("pointercancel",()=>{if(drag&&drag.ghost)drag.ghost.remove();drag=null;});
document.addEventListener("click",e=>{if(!picked||e.target.closest("[data-drag]"))return;const z=e.target.closest("[data-drop]");if(z){dropCard(picked,z);clearPick();}});
function zoneAt(x,y){const t=document.elementFromPoint(x,y);return t?t.closest("[data-drop]"):null;}
function clearPick(){if(picked)picked.classList.remove("selected");picked=null;}
function dropCard(card,zone){
  if(card.dataset.act!==zone.dataset.act)return;
  const kind=zone.dataset.drop, holder=zone.querySelector(".holder")||zone;
  if(kind==="pool"||kind==="bin"){holder.appendChild(card);}
  else{ // 한 칸에 카드 1장: 이미 있으면 자리 바꾸기
    const ex=holder.querySelector("[data-drag]");
    if(ex&&ex!==card){
      const fromZone=card.parentElement.closest("[data-drop]");
      if(fromZone&&fromZone.dataset.drop==="slot")card.parentElement.appendChild(ex);   // 칸끼리 자리 바꾸기
      else zone.closest("section").querySelector(".pool").appendChild(ex);              // 원래 카드는 카드 상자로
    }
    holder.appendChild(card);
  }
  const sec=zone.closest("section");
  sec.querySelectorAll(".ok,.no").forEach(x=>x.classList.remove("ok","no"));
}
function makeCard(i,text,attrs){const c=el("div","dcard",text);c.dataset.drag="1";c.dataset.act=i;Object.assign(c.dataset,attrs||{});return c;}
function makePool(i){const p=el("div","pool");p.dataset.drop="pool";p.dataset.act=i;return p;}

/* ---- 혼합 계산: 먼저 계산할 기호를 눌러요 ---- */
function calcActivity(i,a,sec){
  const body=sec.querySelector(".body");let ei=0,errors=0,log=[];
  const sym={"+":"+","-":"−","*":"×","/":"÷"};
  const title=el("div","",""),expr=el("div","expr"),logEl=el("ol","calc-log"),next=el("button","btn blue","다음 식 ➡️");
  next.style.display="none";body.append(title,expr,logEl,el("div","row").appendChild(next).parentNode);
  let toks;
  const fb=()=>sec.querySelector(":scope > .feedback");
  function tokenize(s){return s.replace(/\s+/g,"").match(/\d+|[()+\-*/]/g).map(t=>/\d/.test(t)?{t:"n",v:+t}:t==="("||t===")"?{t:t}:{t:"o",v:t});}
  function range(){let c=toks.findIndex(x=>x.t===")");if(c<0)return[0,toks.length-1,false];let o=c;while(toks[o].t!=="(")o--;return[o+1,c-1,true];}
  function expected(){const[s,e]=range();for(let k=s;k<=e;k++)if(toks[k].t==="o"&&(toks[k].v==="*"||toks[k].v==="/"))return k;for(let k=s;k<=e;k++)if(toks[k].t==="o")return k;return -1;}
  function cleanup(){let ch=true;while(ch){ch=false;for(let k=0;k+2<toks.length;k++)if(toks[k].t==="("&&toks[k+1].t==="n"&&toks[k+2].t===")"){toks.splice(k,3,toks[k+1]);ch=true;break;}}}
  function render(newIdx){
    expr.innerHTML="";
    toks.forEach((x,k)=>{let n;if(x.t==="o"){n=el("button","op",sym[x.v]);n.onclick=()=>pick(k);}else if(x.t==="n"){n=el("span","num"+(k===newIdx?" new":""),x.v);}else n=el("span","par",x.t);expr.appendChild(n);});
  }
  function load(){toks=tokenize(a.expressions[ei]);log=[];logEl.innerHTML="";title.innerHTML=`<b>식 ${ei+1} / ${a.expressions.length}</b> — 가장 먼저 계산할 기호를 눌러요!`;next.style.display="none";render();}
  function pick(k){
    const ex=expected();
    if(k!==ex){
      errors++;const[s,e,par]=range();let tip;
      if(par&&(k<s||k>e))tip="괄호 ( ) 안을 가장 먼저 계산해요!";
      else if((toks[k].v==="+"||toks[k].v==="-")&&toks.slice(s,e+1).some(x=>x.v==="*"||x.v==="/"))tip="덧셈·뺄셈보다 <b>곱셈·나눗셈</b>을 먼저 계산해요!";
      else tip="같은 단계의 계산은 <b>왼쪽부터</b> 차례로 해요!";
      showFb(fb(),"bad","🤔 "+tip);return;
    }
    const A=toks[k-1].v,B=toks[k+1].v,op=toks[k].v;
    const r=op==="+"?A+B:op==="-"?A-B:op==="*"?A*B:A/B;
    log.push(`${A} ${sym[op]} ${B} = ${r}`);logEl.innerHTML=log.map(x=>`<li>${x}</li>`).join("");
    toks.splice(k-1,3,{t:"n",v:r});cleanup();render(toks.findIndex(x=>x.t==="n"&&x.v===r));
    fb().className="feedback";
    if(toks.length===1){
      title.innerHTML=`<b>식 ${ei+1}</b> 완성! 🎉 답은 <b>${r}</b>`;
      if(ei<a.expressions.length-1){next.style.display="";}
      else{state.acts[i].tries=errors;state.acts[i].detail=`식 ${a.expressions.length}개 완성 (실수 ${errors}번)`;actDone(i,a.success||`🎉 모든 식을 순서대로 계산했어요! (실수 ${errors}번)`);}
    }
  }
  next.onclick=()=>{ei++;load();};
  load();addCtrl(sec,i,a,null);
}

let AC=null;
function playMelody(gainFrom,gainTo,durFrom,durTo){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){toast("이 기기에서는 소리를 낼 수 없어요.");return 0;}
  if(AC.state==="suspended")AC.resume();
  const notes=CONFIG.melody||[261.63,293.66,329.63,392,329.63,293.66,261.63];
  durFrom=durFrom||0.38;durTo=durTo||durFrom;let t=AC.currentTime+0.05;
  notes.forEach((f,k)=>{
    const r=notes.length>1?k/(notes.length-1):0,g=gainFrom+(gainTo-gainFrom)*r,dur=durFrom+(durTo-durFrom)*r;
    const o=AC.createOscillator(),v=AC.createGain();o.type="triangle";o.frequency.value=f;
    v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(Math.max(g,0.002),t+0.03);v.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.92);
    o.connect(v).connect(AC.destination);o.start(t);o.stop(t+dur);t+=dur;
  });
}

    [["L",L],["R",R]].forEach(([k,e])=>{const set=body.querySelector(`.nl-set[data-s=${k}]`);set.style.opacity=e.on?1:.35;set.querySelector(".nl-v").textContent=e.v;set.querySelector(".nl-c").textContent=e.incl?"● 포함(색칠)":"○ 불포함(빈 원)";body.querySelector(`input[data-s=${k}]`).checked=!e.on;});
  }
  function load(){
    const t=a.tasks[ti];L={on:true,v:MIN+2,incl:true};R={on:true,v:MAX-2,incl:true};
    body.querySelector(".nl-task").innerHTML=`<div class="mission"><div>🎯 문제 ${ti+1} / ${a.tasks.length}</div><div style="font-size:1.5rem;font-weight:900">${t.text}</div><div style="font-size:.9rem">수직선에 나타내 보세요.</div></div>`;

  body.querySelectorAll(".nl-none input").forEach(c=>c.onchange=()=>{(c.dataset.s==="L"?L:R).on=!c.checked;draw();});

    if(okL&&okR){showFb(fb(),"good","⭕ 정답! "+(t.explain||""));body.querySelector(".nl-check").disabled=true;

      else{state.acts[i].tries=errors;state.acts[i].detail=`${a.tasks.length}문제 완성 (실수 ${errors}번)`;actDone(i,(a.success||"🎉 모두 맞혔어요!")+` (실수 ${errors}번)`);}}
    else{errors++;const tips=[];
      const side=(ok,e,v,incl,name)=>{if(ok)return;if(v===null){tips.push(`${name}은 끝이 없이 계속 이어져요. ‘끝 없음’을 골라요.`);return;}
        if(!e.on){tips.push(`${name}은 ${v}에서 시작하거나 끝나요.`);return;}
        if(e.v!==v)tips.push(`${name}의 수를 다시 확인해요.`);else tips.push(`${name}: ${v}이(가) <b>${incl?"포함되면 ●":"포함되지 않으면 ○"}</b>로 나타내요.`);};
      side(okL,L,t.from,t.fromIncl,"왼쪽 끝");side(okR,R,t.to,t.toIncl,"오른쪽 끝");
      showFb(fb(),"bad","🤔 "+tips.join("<br>🤔 ")+"<br>💡 이상·이하는 그 수를 <b>포함(●)</b>, 초과·미만은 <b>포함하지 않아요(○)</b>.");}
  };
  body.querySelector(".nl-next").onclick=()=>{ti++;load();};

/* ---- 따라 읽기 + 내 목소리 녹음 (영어) : 브라우저 내장 음성·녹음 기능 사용 ---- */

  const stars=a.items.map(()=>0);

    row.innerHTML=`<div class="stext">${k+1}. ${shown} <span class="arrow">${it.arrow||""}</span></div>

      <span class="s-rate">스스로 평가: ${[1,2,3].map(n=>`<button class="star" data-n="${n}">☆</button>`).join("")}</span></div>

      rb.onclick=async()=>{
        if(rec&&rec.state==="recording"){rec.stop();return;}
        try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];rec=new MediaRecorder(stream);
          rec.ondataavailable=e=>chunks.push(e.data);
          rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));audio=new Audio(url);pb.disabled=false;rb.textContent="🎙️ 다시 녹음";rb.classList.remove("rec-on");toast("녹음 완료! ▶ 내 목소리를 눌러 들어 봐요.");};

        }catch(e){toast("마이크를 쓸 수 없어요. 마이크 허용을 확인하거나 소리 내어 따라 읽어요.");}
      };

    }

      stars[k]=+b.dataset.n;row.querySelectorAll(".star").forEach(x=>x.textContent=+x.dataset.n<=stars[k]?"⭐":"☆");row.classList.add("done");
      const n=stars.filter(x=>x>0).length;state.acts[i].detail=`${n}/${a.items.length}문장 연습, 스스로 평가 평균 ${(stars.reduce((p,c)=>p+c,0)/Math.max(n,1)).toFixed(1)}점(3점 만점)`;
      state.acts[i].answers=a.items.map((it,j)=>({label:it.text.replace(/\*\*/g,""),value:stars[j]?"⭐".repeat(stars[j]):"-"}));

/* ---- 소리 듣고 고르기 (음악: 여러 성부를 함께 들려줘요) ----
   voices: [{notes:"C4 D4 E4 C4", delay:박 수, wave:"triangle"}]  ( - 는 쉼표 ) */
const NOTE={C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196,A3:220,B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880};
function playVoices(voices,beat){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){toast("이 기기에서는 소리를 낼 수 없어요.");return;}
  if(AC.state==="suspended")AC.resume();
  beat=beat||0.42;const t0=AC.currentTime+0.05;
  voices.forEach(v=>{
    v.notes.trim().split(/\s+/).forEach((n,k)=>{
      if(n==="-"||!NOTE[n])return;
      const t=t0+((v.delay||0)+k)*beat,o=AC.createOscillator(),g=AC.createGain();
      o.type=v.wave||"triangle";o.frequency.value=NOTE[n];
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v.gain||0.16,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+beat*0.92);
      o.connect(g).connect(AC.destination);o.start(t);o.stop(t+beat);
    });
  });
}
function audioQuizActivity(i,a,sec){
  const body=sec.querySelector(".body");let right=0;const tried=a.items.map(()=>false);
  if(a.demos){const d=el("div","demo-box","<b>🎧 먼저 들어 봐요</b><div class='row' style='margin-top:6px'></div>");
    a.demos.forEach(m=>{const b=el("button","btn small blue",m.label);b.onclick=()=>{playVoices(m.voices,a.beat||CONFIG.beat);if(m.info)showFb(sec.querySelector(":scope > .feedback"),"info",m.info);};d.querySelector(".row").appendChild(b);});
    body.appendChild(d);}
  a.items.forEach((it,k)=>{
    const row=el("div","litem");const sp=el("button","speak","🔊");sp.onclick=()=>playVoices(it.voices,it.beat||a.beat||CONFIG.beat);
    row.append(sp,el("span","say",`${k+1}. ${it.prompt||"어떤 방법으로 함께 표현했을까요?"}`));
    const msg=el("div","msg","");
    it.options.forEach((o,oi)=>{const b=el("button","choice",esc(o));b.onclick=()=>{
      if(row.classList.contains("done"))return;
      const ok=oi===it.answer;if(!tried[k]){tried[k]=true;if(ok)right++;}
      if(ok){b.classList.add("correct");row.classList.add("done");msg.innerHTML="⭕ "+(it.explain||"정답!");
        if(sec.querySelectorAll(".litem.done").length===a.items.length){state.acts[i].detail=`${a.items.length}개 중 첫 시도 정답 ${right}개`;actDone(i,(a.success||"🎉 모두 맞혔어요!")+` (첫 시도 정답 ${right}/${a.items.length})`);}}
      else{b.classList.add("incorrect");msg.innerHTML="🔁 🔊를 다시 눌러 잘 들어 보고 골라요!";}
    };row.appendChild(b);});
    row.appendChild(msg);body.appendChild(row);
  });
  addCtrl(sec,i,a,null);
}

const KNAME={C4:"도",D4:"레",E4:"미",F4:"파",G4:"솔",A4:"라",B4:"시",C5:"높은 도",D5:"높은 레",E5:"높은 미"};

  const preset=a.preset?a.preset.split(/\s+/).map(n=>n==="-"?null:n):null,locked=a.locked||[];   // 주어진 가락과 바꿀 수 없는 박(0부터)

   <div class="cp-text" style="text-align:center;margin-top:6px;font-weight:700"></div>`;
  const grid=body.querySelector(".cp-grid");grid.style.gridTemplateColumns=`64px repeat(${N},1fr)`;
  notes.forEach((n,r)=>{grid.appendChild(el("div","cp-lab",KNAME[n]||n));for(let c=0;c<N;c++){const b=el("button","cp-cell");b.dataset.r=r;b.dataset.c=c;if(locked.includes(c))b.classList.add("locked");b.onclick=()=>{if(locked.includes(c)){toast("🔒 이 박은 주어진 가락이라 바꿀 수 없어요. 바꿀 수 있는 칸을 골라요!");return;}seq[c]=seq[c]===n?null:n;played=false;draw();playVoices([{notes:n}],0.3);};grid.appendChild(b);}});
  body.querySelector(".cp-mood").innerHTML=a.mission||"🎯 칸을 눌러 나만의 가락을 만들어요!";
  function draw(){grid.querySelectorAll(".cp-cell").forEach(b=>b.classList.toggle("on",seq[+b.dataset.c]===notes[+b.dataset.r]));
    body.querySelector(".cp-text").textContent="🎼 "+seq.map(n=>n?(KNAME[n]||n):"쉼").join(" - ");}
  body.querySelector(".cp-clear").onclick=()=>{seq=preset?preset.slice():Array(N).fill(null);played=false;draw();};
  if(preset){const b=el("button","btn small gray","🎼 원래 가락 듣기");b.onclick=()=>playVoices([{notes:preset.map(n=>n||"-").join(" ")}],a.beat||0.4);body.querySelector(".cp-play").after(b);}
  body.querySelector(".cp-play").onclick=()=>{
    const filled=seq.filter(Boolean).length;
    playVoices([{notes:seq.map(n=>n||"-").join(" ")}],a.beat||0.4);
    if(filled<(a.minFilled||6)){showFb(fb(),"info",`🎵 ${filled}개의 음을 골랐어요. ${(a.minFilled||6)}개 이상 채워 가락을 완성해 봐요!`);return;}
    if(preset&&seq.every((n,k)=>n===preset[k])){showFb(fb(),"info","🎵 아직 원래 가락과 똑같아요. 바꿀 수 있는 칸의 음을 바꿔 봐요!");return;}
    if(a.endTip&&a.mustEnd&&seq[N-1]!==a.endTip){showFb(fb(),"bad",`📌 조건: 마지막 음을 ‘${KNAME[a.endTip]}’로 끝내야 해요.`);return;}
    const last=seq.filter(Boolean).slice(-1)[0];
    state.acts[i].answers=[{label:"내가 만든 가락",value:seq.map(n=>n?(KNAME[n]||n):"쉼").join(" - ")}];
    state.acts[i].detail=`${filled}개 음으로 가락 완성`;
    actDone(i,(a.success||"🎉 멋진 가락이 완성되었어요!")+(a.endTip&&last!==a.endTip?` <br>💡 마지막 음을 ‘${KNAME[a.endTip]}’로 끝내면 더 안정감 있게 끝나요!`:""));
  };
  draw();addCtrl(sec,i,a,null);
}

/* ---- 팔 모형 (과학: 뼈와 근육) : 슬라이더로 팔을 굽혔다 펴요 ---- */
function armActivity(i,a,sec){
  const body=sec.querySelector(".body"),fb=()=>sec.querySelector(":scope > .feedback");let bent=false,straight=false;
  body.innerHTML=`<svg class="arm-svg" viewBox="0 0 360 250">
     <rect x="20" y="180" width="160" height="26" rx="13" fill="#f1e6d6" stroke="#b9a68a" stroke-width="2"/>
     <text x="100" y="228" text-anchor="middle" font-size="13" fill="#6b5b4b">위팔뼈</text>
     <g class="arm-fore"><rect x="180" y="181" width="150" height="22" rx="11" fill="#f1e6d6" stroke="#b9a68a" stroke-width="2"/>
       <text x="255" y="176" text-anchor="middle" font-size="13" fill="#6b5b4b">아래팔뼈</text><text x="332" y="200" font-size="22">✋</text></g>
     <path class="arm-mus" fill="#ff8fab" opacity=".85"/><path class="arm-mus2" fill="#7cc6fe" opacity=".8"/>
     <circle cx="180" cy="192" r="9" fill="#ffd6e0" stroke="#d68aa0" stroke-width="2"/>
   </svg>
   <div class="slider-box" style="background:var(--sky);border-radius:16px;padding:10px 14px">💪 <b>팔 굽히기</b> : <span class="arm-l">0°</span>
     <input type="range" min="0" max="130" value="0" class="arm-r"></div>
   <div class="row" style="margin-top:8px;gap:14px;font-weight:700"><span>🩷 안쪽 근육: <span class="arm-in"></span></span><span>🩵 바깥쪽 근육: <span class="arm-out"></span></span></div>
   <div class="mission arm-m" style="margin-top:8px"></div>`;
  const r=body.querySelector(".arm-r"),fore=body.querySelector(".arm-fore");
  function draw(){
    const ang=+r.value,rad=ang*Math.PI/180;fore.setAttribute("transform",`rotate(${-ang} 180 192)`);
    const ex=180+55*Math.cos(rad),ey=180-55*Math.sin(rad);           // 근육이 아래팔뼈에 붙는 곳
    const bulge=10+ang*0.18;                                          // 굽힐수록 두꺼워져요
    body.querySelector(".arm-mus").setAttribute("d",`M45 180 Q ${(45+ex)/2} ${172-bulge} ${ex} ${ey} L ${ex+4*Math.sin(rad)} ${ey+6*Math.cos(rad)} Q ${(45+ex)/2} ${180-bulge*0.3} 45 186 Z`);
    const tb=Math.max(2,12-ang*0.08);                                 // 바깥쪽 근육은 늘어나며 얇아져요
    body.querySelector(".arm-mus2").setAttribute("d",`M45 206 Q 115 ${206+tb} 186 ${200+ang*0.05} L 186 ${204+ang*0.05} Q 115 ${210+tb} 45 210 Z`);
    body.querySelector(".arm-l").textContent=ang+"°";
    body.querySelector(".arm-in").textContent=ang>20?"짧아지며 두꺼워져요 (뼈를 당겨요)":"늘어나 있어요";
    body.querySelector(".arm-out").textContent=ang>20?"늘어나요":"짧아져 있어요";
    if(ang>=90&&!bent){bent=true;showFb(fb(),"good","⭕ 팔을 굽히니 <b>안쪽 근육의 길이가 줄어들며</b> 아래팔뼈를 당겨 올렸어요!");}
    if(bent&&ang<=10&&!straight){straight=true;showFb(fb(),"good","⭕ 팔을 펴니 <b>안쪽 근육은 늘어나고 바깥쪽 근육이 줄어들며</b> 아래팔뼈를 당겼어요!");}
    body.querySelector(".arm-m").innerHTML=!bent?"🎯 미션 1: 슬라이더로 팔을 <b>90° 이상 굽혀</b> 보세요.":!straight?"🎯 미션 2: 이제 팔을 <b>쭉 펴</b> 보세요 (10° 이하).":"🏅 미션 완료! 근육이 줄어들고 늘어나며 뼈를 움직여요.";
    if(bent&&straight&&!state.acts[i].done){state.acts[i].detail="팔 굽히기·펴기 관찰 완료";actDone(i,a.success);}
  }
  r.oninput=draw;draw();addCtrl(sec,i,a,null);
}

/* ---- 지도 그림 (사회) ---- */
const MAPS={

};

/* =====================================================================
   형성 평가
   ===================================================================== */
function buildQuiz(){
  const box=$("#quiz");box.innerHTML="";state.quiz.answers=CONFIG.quiz.map(()=>null);state.quiz.done=false;$("#scorePanel").classList.remove("show");
  CONFIG.quiz.forEach((it,qi)=>{
    const q=el("div","q",`<h3><span class="qn">${qi+1}</span>${esc(it.q).replace(/\n/g,"<br>")}</h3><div class="opts"></div><div class="feedback"></div>`);
    it.options.forEach((o,oi)=>{const b=el("button","opt",`${"①②③④⑤"[oi]} ${esc(o)}`);b.onclick=()=>answer(qi,oi,q);q.querySelector(".opts").appendChild(b);});
    box.appendChild(q);
  });
}
function answer(qi,oi,q){
  if(state.quiz.answers[qi]!==null)return;const it=CONFIG.quiz[qi],ok=oi===it.answer;state.quiz.answers[qi]=oi;
  q.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===it.answer)b.classList.add("correct");else if(k===oi)b.classList.add("incorrect");});
  showFb(q.querySelector(".feedback"),ok?"good":"bad",(ok?"⭕ <b>정답이에요!</b>":`❌ <b>아쉬워요! 정답은 ${it.answer+1}번이에요.</b>`)+"<br>📖 "+it.explain);
  if(state.quiz.answers.every(a=>a!==null))finishQuiz();
}
function quizScore(){const n=CONFIG.quiz.length,r=state.quiz.answers.filter((a,i)=>a===CONFIG.quiz[i].answer).length;return{r,n,pct:Math.round(r/n*100)};}
function finishQuiz(){
  state.quiz.done=true;const{r,n,pct}=quizScore();
  $("#scoreBig").textContent=`${n}문제 중 ${r}문제 정답 (${pct}점)`;$("#stars").textContent="⭐".repeat(r)+"☆".repeat(n-r);
  $("#praise").textContent=CONFIG.praise.find(p=>pct>=p.min).msg;$("#scorePanel").classList.add("show");markNav("s-quiz");
  if(pct>=80)confetti(30);setTimeout(()=>$("#scorePanel").scrollIntoView({behavior:"smooth",block:"center"}),300);renderSummary();
}
$("#quizRetry").onclick=()=>{markNav("s-quiz",false);buildQuiz();renderSummary();$("#s-quiz").scrollIntoView({behavior:"smooth"});};

/* =====================================================================
   결과 요약 · 저장 · 인쇄
   ===================================================================== */
function resultData(){
  const q=quizScore();
  return{name:$("#stuName").value.trim(),id:$("#stuId").value.trim(),date:new Date().toLocaleString("ko-KR"),
    acts:CONFIG.activities.map((a,i)=>({title:a.title,done:state.acts[i].done,detail:state.acts[i].detail,answers:state.acts[i].answers||null})),
    quizDone:state.quiz.done,quizRight:q.r,quizTotal:q.n,quizPct:q.pct,reflect:$("#reflect").value.trim()};
}
function renderSummary(){
  const d=resultData();
  $("#summary").innerHTML=`<ul style="margin:0;padding-left:20px">
    <li>👤 <b>${esc(d.name||"(이름 미입력)")}</b> / 학번 ${esc(d.id||"-")}</li>
    ${d.acts.map((a,i)=>`<li>${CONFIG.activities[i].icon||ICONS[CONFIG.activities[i].type]} ${esc(a.title)}: ${a.done?"✅ 완료":"⏳ 진행 중"}${a.detail?` — ${esc(a.detail)}`:""}${a.answers?`<ul>${a.answers.map(x=>`<li>${esc(x.label)} : ${esc(x.value||"-")}</li>`).join("")}</ul>`:""}</li>`).join("")}
    <li>📝 형성 평가: ${d.quizDone?`${d.quizTotal}문제 중 ${d.quizRight}문제 정답 (${d.quizPct}점)`:"⏳ 아직 다 풀지 않음"}</li></ul>
    <div class="print-only" style="margin-top:8px"><b>✍️ 배운 점:</b> ${esc(d.reflect||"")}</div>`;
}
["#stuName","#stuId","#reflect"].forEach(s=>$(s).addEventListener("input",()=>{renderSummary();if($("#reflect").value.trim())markNav("s-result");}));

$("#saveBtn").addEventListener("click",async()=>{
  const d=resultData();
  if(!d.name){toast("✏️ 맨 위에 이름을 먼저 써 주세요!");$("#stuName").focus();return;}
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({name:d.name,id:d.id,reflect:d.reflect}));}catch(e){}
  const lines=[`[${CONFIG.subject}] ${CONFIG.unit} 활동 결과`,`성취기준: ${CONFIG.standardCode} ${CONFIG.standardText}`,`이름: ${d.name}   학번: ${d.id||"-"}   저장 시각: ${d.date}`,""];
  d.acts.forEach((a,i)=>{lines.push(`■ 탐구 활동 ${i+1} (${a.title}): ${a.done?"완료":"미완료"}${a.detail?" — "+a.detail:""}`);if(a.answers)a.answers.forEach(x=>lines.push(`   - ${x.label}: ${x.value||"-"}`));});
  lines.push(`■ 형성 평가: ${d.quizDone?`${d.quizTotal}문제 중 ${d.quizRight}문제 정답 (${d.quizPct}점)`:"미완료"}`);
  CONFIG.quiz.forEach((q,i)=>{const a=state.quiz.answers[i];lines.push(`   ${i+1}번: ${a===null?"미응답":(a===q.answer?"O":"X")+` (내 답 ${a+1}번 / 정답 ${q.answer+1}번)`}`);});
  lines.push("",`■ 배운 점: ${d.reflect||"(작성하지 않음)"}`);
  const n=new Date(),p=v=>String(v).padStart(2,"0");
  const stamp=`${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}-${p(n.getHours())}${p(n.getMinutes())}`;
  const fileName=safeName(`${CONFIG.fileTag}_${d.id?d.id+"_":""}${d.name}_${stamp}.txt`),content="﻿"+lines.join("\n");
  const where=await saveToChosenFolder(fileName,content);
  if(where){markNav("s-result");toast(`📁 '${where}' 폴더에 저장했어요!`);return;}
  downloadFile(fileName,content);markNav("s-result");toast("💾 '다운로드' 폴더에 저장했어요! 파일을 선생님께 제출해요.");
});
$("#printBtn").onclick=()=>{renderSummary();window.print();};

/* =====================================================================
   📁 저장 폴더 기능
   - PC의 크롬·엣지: 폴더를 한 번 고르면 그 폴더에 바로 저장돼요.
   - 아이패드·스마트폰·사파리 등: 자동으로 '다운로드' 폴더에 저장돼요.
   ===================================================================== */
const FS_SUPPORTED=("showDirectoryPicker" in window)&&window.isSecureContext&&window.self===window.top;
let dirHandle=null;
function safeName(s){return s.replace(/[\\/:*?"<>|]/g,"_");}
function downloadFile(name,content){const blob=new Blob([content],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("worksheet-folder",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function dbGet(k){try{const db=await openDB();return await new Promise(res=>{const q=db.transaction("h").objectStore("h").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null;}}
async function dbSet(k,v){try{const db=await openDB();await new Promise(res=>{const tx=db.transaction("h","readwrite");tx.objectStore("h").put(v,k);tx.oncomplete=res;tx.onerror=res;});}catch(e){}}
function showFolder(){const L=$("#folderLabel");if(dirHandle){L.textContent=`✅ 저장 폴더: 📁 ${dirHandle.name}`;L.classList.add("on");$("#folderBtn").textContent="📁 저장 폴더 바꾸기";}else{L.textContent="아직 폴더를 고르지 않았어요 → 고르지 않으면 '다운로드' 폴더에 저장돼요";L.classList.remove("on");$("#folderBtn").textContent="📁 저장 폴더 선택";}}
async function pickFolder(){try{dirHandle=await window.showDirectoryPicker({id:"worksheet-save",mode:"readwrite"});await dbSet("dir",dirHandle);showFolder();toast(`📁 '${dirHandle.name}' 폴더에 저장하도록 설정했어요!`);}catch(e){if(e&&e.name!=="AbortError")toast("⚠️ 이 폴더는 선택할 수 없어요. 다른 폴더를 골라 주세요.");}}
async function saveToChosenFolder(name,content){
  if(!FS_SUPPORTED||!dirHandle)return null;
  try{let perm=await dirHandle.queryPermission({mode:"readwrite"});if(perm!=="granted")perm=await dirHandle.requestPermission({mode:"readwrite"});
    if(perm!=="granted"){toast("폴더 사용을 허용하지 않아 '다운로드' 폴더에 저장할게요.");return null;}
    const fh=await dirHandle.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(content);await w.close();return dirHandle.name;
  }catch(e){console.warn("폴더 저장 실패 → 다운로드로 대신 저장",e);return null;}
}
(async function initFolder(){
  if(!FS_SUPPORTED){$("#saveNote").textContent="※ 이 기기·브라우저에서는 결과가 '다운로드' 폴더에 글 파일(.txt)로 저장돼요. (원하는 폴더에 저장하려면 PC의 크롬이나 엣지에서 열어요) PDF는 인쇄 창에서 'PDF로 저장'을 고르세요.";return;}
  $("#folderBox").classList.add("show");$("#folderBtn").addEventListener("click",pickFolder);dirHandle=await dbGet("dir");showFolder();
  $("#saveNote").textContent="※ 저장 폴더를 한 번 골라 두면 다음부터 그 폴더에 바로 저장돼요. 브라우저를 다시 열면 '허용'을 한 번 눌러야 할 수 있어요. PDF는 인쇄 창에서 'PDF로 저장'을 고르세요.";
})();

/* ---------- 이전에 쓴 이름·배운 점 불러오기 ---------- */
try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(s){$("#stuName").value=s.name||"";$("#stuId").value=s.id||"";$("#reflect").value=s.reflect||"";}}catch(e){}

/* ---------- 시작 ---------- */
initActivities();buildQuiz();renderSummary();
</script>
